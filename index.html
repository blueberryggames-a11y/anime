<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=Bebas+Neue&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
:root{--bg:#080810;--bg2:#0e0e1a;--bg3:#141422;--bg4:#1a1a2e;--border:rgba(120,100,255,0.12);--accent:#6c5ce7;--accent2:#a29bfe;--glow:rgba(108,92,231,0.4);--text:#e2e2f0;--muted:#5a5a7a;--red:#ff6b6b;--green:#55efc4;--gold:#ffd32a;--r:8px}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}
::-webkit-scrollbar{width:4px;height:4px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--accent);border-radius:4px}

#proxy-banner{background:linear-gradient(90deg,#100820,#081020);border-bottom:1px solid rgba(108,92,231,.3);padding:9px 22px;display:flex;align-items:center;gap:10px;font-size:.78rem;color:var(--muted);flex-wrap:wrap}
#proxy-banner strong{color:var(--accent2)}#proxy-banner a{color:var(--accent2);font-size:.7rem}
#proxy-input{flex:1;min-width:200px;max-width:380px;padding:5px 10px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-family:inherit;font-size:.78rem;outline:none}
#proxy-input:focus{border-color:var(--accent)}
#proxy-save{padding:5px 13px;border-radius:5px;background:var(--accent);border:none;color:#fff;font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer}
#proxy-save:hover{background:var(--accent2)}
#banner-x{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:.95rem;padding:0 3px}

nav{position:sticky;top:0;z-index:200;height:54px;display:flex;align-items:center;gap:14px;padding:0 22px;background:rgba(8,8,16,0.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--border)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.55rem;letter-spacing:2px;color:var(--accent2);cursor:pointer;flex-shrink:0;text-shadow:0 0 18px var(--glow)}
.logo span{color:var(--accent)}
.swrap{flex:1;max-width:440px;position:relative;margin:0 14px}
.swrap input{width:100%;padding:7px 14px 7px 35px;background:var(--bg3);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:inherit;font-size:.84rem;outline:none;transition:border .15s}
.swrap input:focus{border-color:var(--accent)}.swrap input::placeholder{color:var(--muted)}
.s-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.sdd{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;box-shadow:0 20px 50px rgba(0,0,0,.8);z-index:300;display:none}
.sdd.open{display:block}
.si{display:flex;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;border-bottom:1px solid var(--border);transition:background .12s}
.si:last-child{border-bottom:none}.si:hover{background:var(--bg4)}
.si img{width:32px;height:44px;object-fit:cover;border-radius:4px;flex-shrink:0}
.si-t{font-size:.81rem;font-weight:500}.si-m{font-size:.68rem;color:var(--muted);margin-top:2px}
.ntabs{display:flex;gap:2px;margin-left:auto}
.ntab{padding:5px 12px;border-radius:5px;font-size:.77rem;font-weight:500;cursor:pointer;color:var(--muted);background:none;border:none;font-family:inherit;transition:all .14s}
.ntab:hover,.ntab.active{background:var(--bg3);color:var(--accent2)}
.pbtn{padding:5px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:.72rem;font-family:inherit;transition:all .14s}
.pbtn:hover{color:var(--accent2);border-color:rgba(162,155,254,.3)}.pbtn.ok{color:var(--green);border-color:rgba(85,239,196,.2)}

.page{display:none}.page.active{display:block}

/* HOME */
.hero{position:relative;width:100%;height:450px;overflow:hidden}
.hbg{position:absolute;inset:0;background-size:cover;background-position:center 25%;transition:background-image .5s;filter:brightness(.22) saturate(1.4)}
.hbg::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(8,8,16,.99) 22%,rgba(8,8,16,.35) 62%,transparent),linear-gradient(to top,var(--bg) 0%,transparent 30%)}
.hc{position:relative;z-index:2;height:100%;display:flex;align-items:flex-end;padding:0 34px 46px;max-width:600px}
.hi{display:flex;flex-direction:column;gap:11px}
.hchips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:2px 9px;border-radius:20px;background:rgba(108,92,231,.18);border:1px solid rgba(162,155,254,.28);font-size:.63rem;font-weight:600;color:var(--accent2);letter-spacing:.5px;text-transform:uppercase}
.htitle{font-family:'Bebas Neue',sans-serif;font-size:clamp(1.8rem,3.5vw,2.9rem);letter-spacing:1.5px;line-height:1;text-shadow:0 2px 18px rgba(0,0,0,.9)}
.hdesc{font-size:.83rem;color:rgba(226,226,240,.5);line-height:1.7;max-width:450px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hbtns{display:flex;gap:8px}
.bw{display:flex;align-items:center;gap:6px;padding:8px 18px;border-radius:6px;background:var(--accent);color:#fff;font-family:inherit;font-size:.82rem;font-weight:600;border:none;cursor:pointer;transition:all .14s;box-shadow:0 4px 16px var(--glow)}
.bw:hover{background:var(--accent2);transform:translateY(-1px)}
.bg{display:flex;align-items:center;gap:6px;padding:8px 15px;border-radius:6px;background:rgba(255,255,255,.06);color:var(--text);font-family:inherit;font-size:.82rem;font-weight:500;border:1px solid var(--border);cursor:pointer;transition:all .14s}
.bg:hover{background:rgba(255,255,255,.1)}
.hdots{position:absolute;bottom:16px;right:34px;z-index:2;display:flex;gap:5px;align-items:center}
.dot{width:5px;height:5px;border-radius:3px;background:var(--muted);cursor:pointer;border:none;transition:all .28s}
.dot.active{width:18px;background:var(--accent2)}
.gstrip{display:flex;gap:7px;padding:16px 26px 12px;overflow-x:auto;scrollbar-width:none}
.gstrip::-webkit-scrollbar{display:none}
.gchip{flex-shrink:0;padding:4px 13px;border-radius:20px;background:var(--bg3);border:1px solid var(--border);font-size:.74rem;font-weight:500;cursor:pointer;transition:all .14s;color:var(--muted);font-family:inherit}
.gchip:hover,.gchip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.sec{padding:4px 26px 34px}
.sechd{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.sectitle{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:1px;color:var(--accent2);display:flex;align-items:center;gap:9px}
.sectitle::before{content:'';display:block;width:3px;height:15px;background:linear-gradient(180deg,var(--accent),var(--accent2));border-radius:2px}
.lmbtn{font-size:.74rem;color:var(--accent2);cursor:pointer;background:none;border:1px solid var(--border);border-radius:5px;padding:4px 11px;font-family:inherit;transition:all .13s}
.lmbtn:hover{border-color:var(--accent);color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:13px}
.card{position:relative;cursor:pointer;border-radius:var(--r);overflow:hidden;background:var(--bg3);aspect-ratio:3/4;transition:transform .18s,box-shadow .18s}
.card:hover{transform:translateY(-5px) scale(1.02);box-shadow:0 12px 32px rgba(0,0,0,.65)}
.card img{width:100%;height:100%;object-fit:cover;display:block;transition:filter .18s}
.card:hover img{filter:brightness(.4)}
.cov{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,8,16,.97) 0%,transparent 52%);display:flex;flex-direction:column;justify-content:flex-end;padding:10px 9px 9px}
.ct{font-size:.74rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cm{font-size:.64rem;color:var(--muted);margin-top:2px}
.sb{position:absolute;top:7px;right:7px;background:rgba(0,0,0,.75);backdrop-filter:blur(5px);padding:2px 6px;border-radius:4px;font-size:.66rem;font-weight:700;color:var(--gold);font-family:'Space Mono',monospace}
.eb{position:absolute;top:7px;left:7px;background:rgba(108,92,231,.85);padding:2px 6px;border-radius:4px;font-size:.66rem;font-weight:600;color:#fff}
.pov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .15s}
.card:hover .pov{opacity:1}
.pc{width:42px;height:42px;border-radius:50%;background:rgba(108,92,231,.9);display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,.2)}
.skel{border-radius:var(--r);aspect-ratio:3/4;background:linear-gradient(90deg,var(--bg3) 25%,var(--bg4) 50%,var(--bg3) 75%);background-size:200% 100%;animation:shim 1.3s infinite}
@keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* WATCH */
.wl{display:grid;grid-template-columns:1fr 316px;max-width:1380px;margin:0 auto}
.pcol{border-right:1px solid var(--border);min-width:0}
.pwrap{position:relative;width:100%;background:#000;aspect-ratio:16/9}
video#player{width:100%;height:100%;display:block;background:#000}
.pmsg{position:absolute;inset:0;background:rgba(0,0,0,.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:10}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--bg3);border-top-color:var(--accent);animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ptxt{font-size:.79rem;color:var(--muted);text-align:center;max-width:280px;line-height:1.5}
.perr{color:var(--red);font-size:.79rem;text-align:center;max-width:320px;line-height:1.6}
.perr small{display:block;margin-top:4px;color:var(--muted);font-size:.7rem}
.rbtn{margin-top:4px;padding:6px 16px;border-radius:5px;background:var(--accent);border:none;color:#fff;font-family:inherit;font-size:.76rem;cursor:pointer}
.rbtn:hover{background:var(--accent2)}
#skip-btn{position:absolute;bottom:52px;right:14px;z-index:11;padding:7px 16px;border-radius:5px;background:rgba(18,18,32,.9);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.15);color:#fff;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;display:none;transition:background .14s}
#skip-btn:hover{background:var(--accent)}#skip-btn.on{display:block}
.ctrl{display:flex;gap:9px;align-items:center;flex-wrap:wrap;padding:8px 17px;border-bottom:1px solid var(--border)}
.clbl{font-size:.68rem;color:var(--muted);font-weight:500}
.cgrp{display:flex;gap:4px}
.cb{padding:4px 10px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:.74rem;font-weight:500;cursor:pointer;font-family:inherit;transition:all .12s}
.cb:hover,.cb.active{background:var(--accent);border-color:var(--accent);color:#fff}
.csep{width:1px;height:17px;background:var(--border)}
.nbtns{display:flex;gap:6px;margin-left:auto}
.enav{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:5px;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:.74rem;font-weight:500;cursor:pointer;font-family:inherit;transition:all .12s}
.enav:hover:not(:disabled){background:var(--bg4)}.enav:disabled{opacity:.3;cursor:default}
.eps{background:var(--bg2);display:flex;flex-direction:column;max-height:calc(100vh - 54px);position:sticky;top:54px;overflow:hidden;border-left:1px solid var(--border)}
.ephd{padding:12px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.epht{font-size:.82rem;font-weight:600}.epct{font-size:.68rem;color:var(--muted)}
.epfb{padding:6px 9px;border-bottom:1px solid var(--border);flex-shrink:0}
.epfb input{width:100%;padding:5px 9px;background:var(--bg3);border:1px solid var(--border);border-radius:5px;color:var(--text);font-family:inherit;font-size:.76rem;outline:none}
.epfb input:focus{border-color:var(--accent)}
.eplist{flex:1;overflow-y:auto}
.epi{display:flex;gap:8px;padding:7px 10px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.022);border-left:2px solid transparent;transition:background .11s}
.epi:hover{background:var(--bg3)}.epi.active{background:rgba(108,92,231,.1);border-left-color:var(--accent)}
.epn{width:34px;flex-shrink:0;height:22px;border-radius:4px;background:var(--bg4);display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:.72rem;font-weight:700;color:var(--muted);align-self:center}
.epi.active .epn{color:var(--accent2)}
.ept{font-size:.75rem;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.epi.active .ept{color:var(--accent2)}
.ainfo{padding:18px}
.aihead{display:flex;gap:14px;margin-bottom:14px}
.aiposter{width:84px;flex-shrink:0;border-radius:7px;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.5)}
.aiposter img{width:100%;display:block}
.aititle{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:.4px;line-height:1.15;margin-bottom:6px}
.aichips{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
.aistats{display:flex;gap:14px}
.aisv{font-size:.86rem;font-weight:700}.aisl{font-size:.63rem;color:var(--muted);margin-top:1px}
.aidesc{font-size:.82rem;color:rgba(226,226,240,.58);line-height:1.7;margin-top:12px}
.aidesc.col{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.xbtn{background:none;border:none;color:var(--accent2);font-family:inherit;font-size:.76rem;cursor:pointer;margin-top:4px;padding:0}
.relsec{padding:16px 18px;border-top:1px solid var(--border)}
.relscroll{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-top:10px}
.relscroll::-webkit-scrollbar{display:none}
.relcard{flex-shrink:0;width:96px;cursor:pointer;transition:transform .14s}
.relcard:hover{transform:translateY(-3px)}
.relcard img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:6px;display:block;margin-bottom:4px}
.relct{font-size:.66rem;font-weight:500;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.relcf{font-size:.59rem;color:var(--muted);margin-top:2px}

/* Debug log */
#dbg{position:fixed;bottom:0;left:0;right:0;max-height:160px;overflow-y:auto;background:rgba(0,0,0,.88);font-family:'Space Mono',monospace;font-size:.65rem;color:#a29bfe;padding:6px 10px;z-index:9000;display:none;border-top:1px solid var(--border)}
#dbg.on{display:block}
#dbg-toggle{position:fixed;bottom:6px;right:6px;z-index:9001;padding:3px 7px;border-radius:4px;background:var(--bg4);border:1px solid var(--border);color:var(--muted);font-size:.65rem;cursor:pointer;font-family:inherit}

#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(65px);background:var(--bg3);border:1px solid var(--border);padding:8px 17px;border-radius:7px;font-size:.79rem;z-index:9999;transition:transform .26s;box-shadow:0 5px 18px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}
#toast.show{transform:translateX(-50%) translateY(0)}

@media(max-width:900px){.wl{grid-template-columns:1fr}.eps{position:static;max-height:320px;border-left:none;border-top:1px solid var(--border)}}
@media(max-width:600px){nav{padding:0 10px;gap:8px}.ntabs{display:none}.grid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.hero{height:280px}.hc{padding:0 14px 26px}.sec{padding:4px 12px 26px}.gstrip{padding:12px 12px 8px}}
</style>
</head>
<body>

<div id="proxy-banner">
  <span>⚙ <strong>Cloudflare Worker URL</strong> — needed to bypass CORS &nbsp;
    <a href="https://dash.cloudflare.com" target="_blank" rel="noopener">(deploy worker.js →)</a>
  </span>
  <input type="text" id="proxy-input" placeholder="https://your-worker.workers.dev">
  <button id="proxy-save" onclick="saveProxy()">Save</button>
  <button id="banner-x" onclick="dismissBanner()">✕</button>
</div>

<nav>
  <div class="logo" onclick="showHome()">ANI<span>MURA</span></div>
  <div class="swrap">
    <svg class="s-ico" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" id="search-input" placeholder="Search anime…" autocomplete="off">
    <div class="sdd" id="sdd"></div>
  </div>
  <div class="ntabs">
    <button class="ntab active" onclick="setTab(this,'TRENDING_DESC')">Trending</button>
    <button class="ntab" onclick="setTab(this,'POPULARITY_DESC')">Popular</button>
    <button class="ntab" onclick="setTab(this,'upcoming')">Upcoming</button>
    <button class="ntab" onclick="setTab(this,'recent')">Season</button>
  </div>
  <button class="pbtn" id="pbtn" onclick="toggleBanner()">⚙ Worker</button>
</nav>

<div class="page active" id="home">
  <div class="hero">
    <div class="hbg" id="hbg"></div>
    <div class="hc">
      <div class="hi">
        <div class="hchips" id="hchips"></div>
        <div class="htitle" id="htitle">Loading…</div>
        <div class="hdesc" id="hdesc"></div>
        <div class="hbtns">
          <button class="bw" id="hwat">▶ Watch Now</button>
          <button class="bg" id="hinf">ℹ Details</button>
        </div>
      </div>
    </div>
    <div class="hdots" id="hdots"></div>
  </div>
  <div class="gstrip">
    <button class="gchip active" onclick="fG(this,'')">All</button>
    <button class="gchip" onclick="fG(this,'Action')">Action</button>
    <button class="gchip" onclick="fG(this,'Romance')">Romance</button>
    <button class="gchip" onclick="fG(this,'Fantasy')">Fantasy</button>
    <button class="gchip" onclick="fG(this,'Comedy')">Comedy</button>
    <button class="gchip" onclick="fG(this,'Drama')">Drama</button>
    <button class="gchip" onclick="fG(this,'Sci-Fi')">Sci-Fi</button>
    <button class="gchip" onclick="fG(this,'Horror')">Horror</button>
    <button class="gchip" onclick="fG(this,'Mystery')">Mystery</button>
    <button class="gchip" onclick="fG(this,'Psychological')">Psychological</button>
    <button class="gchip" onclick="fG(this,'Mecha')">Mecha</button>
    <button class="gchip" onclick="fG(this,'Slice of Life')">Slice of Life</button>
    <button class="gchip" onclick="fG(this,'Sports')">Sports</button>
    <button class="gchip" onclick="fG(this,'Supernatural')">Supernatural</button>
  </div>
  <div class="sec">
    <div class="sechd">
      <div class="sectitle" id="gtitle">Trending</div>
      <button class="lmbtn" onclick="loadMore()">Load More ↓</button>
    </div>
    <div class="grid" id="mgrid"></div>
  </div>
</div>

<div class="page" id="watch">
  <div class="wl">
    <div class="pcol">
      <div class="pwrap">
        <!-- Native <video> only — NO iframes, Miruro blocks X-Frame-Options -->
        <video id="player" controls playsinline></video>
        <div class="pmsg" id="pmsg">
          <div class="spin"></div>
          <div class="ptxt" id="ptxt">Select an episode</div>
        </div>
        <button id="skip-btn" onclick="doSkip()"></button>
      </div>
      <div class="ctrl">
        <span class="clbl">Audio:</span>
        <div class="cgrp">
          <button class="cb active" id="btn-sub" onclick="swAudio('sub')">SUB</button>
          <button class="cb" id="btn-dub" onclick="swAudio('dub')">DUB</button>
        </div>
        <div class="csep"></div>
        <div class="nbtns">
          <button class="enav" id="btn-prev" onclick="prevEp()">
            <svg width="9" height="9" fill="currentColor" viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 4v16H3V4h2z"/></svg>Prev
          </button>
          <button class="enav" id="btn-next" onclick="nextEp()">Next
            <svg width="9" height="9" fill="currentColor" viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zm14 0v16h-2V4h2z"/></svg>
          </button>
        </div>
      </div>
      <div class="ainfo" id="ainfo"></div>
      <div class="relsec" id="relsec" style="display:none"></div>
    </div>
    <div class="eps">
      <div class="ephd"><span class="epht">Episodes</span><span class="epct" id="epct"></span></div>
      <div class="epfb"><input type="text" id="epf" placeholder="Filter episodes…"></div>
      <div class="eplist" id="eplist"></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="dbg"></div>
<button id="dbg-toggle" onclick="document.getElementById('dbg').classList.toggle('on')">dbg</button>

<script>
// ── DEBUG LOG ──────────────────────────────────────────────────────────────────
const dbgEl = document.getElementById('dbg');
function log(...args) {

// ── PROXY ──────────────────────────────────────────────────────────────────────
let PROXY = localStorage.getItem('animura_proxy') || '';

/**
 * Fetch a URL through the worker's /page route.
 * The worker handles CORS so we can read the response body.
 */
async function pFetch(url) {
  if (!PROXY) { showBanner(); throw new Error('No Worker URL configured — paste it in the banner above.'); }
  const workerUrl = PROXY.replace(/\/$/, '') + '/page?url=' + encodeURIComponent(url);
  log('pFetch:', workerUrl);
  const r = await fetch(workerUrl);
  if (!r.ok) throw new Error(`Worker returned HTTP ${r.status} for ${url}`);
  return r;
}

/**
 * Return a proxied stream URL (worker rewrites m3u8 segment lines).
 */
function pStream(url) {
  if (!PROXY) return url;
  return PROXY.replace(/\/$/, '') + '/stream?url=' + encodeURIComponent(url);
}

function saveProxy() {
  const v = document.getElementById('proxy-input').value.trim();
  if (!v) { toast('Paste Worker URL first!'); return; }
  PROXY = v; localStorage.setItem('animura_proxy', v);
  updatePBtn(); dismissBanner(); toast('✓ Saved!');
}
function dismissBanner() {
  document.getElementById('proxy-banner').style.display = 'none';
  if (PROXY) localStorage.setItem('animura_bok', '1');
}
function showBanner() { document.getElementById('proxy-banner').style.display = 'flex'; }
function toggleBanner() { const b = document.getElementById('proxy-banner'); b.style.display = b.style.display === 'none' ? 'flex' : 'none'; }
function updatePBtn() { const b = document.getElementById('pbtn'); b.textContent = PROXY ? '✓ Worker' : '⚙ Worker'; b.classList.toggle('ok', !!PROXY); }
if (PROXY) { document.getElementById('proxy-input').value = PROXY; updatePBtn(); if (localStorage.getItem('animura_bok')) document.getElementById('proxy-banner').style.display = 'none'; }

// ── ANILIST ────────────────────────────────────────────────────────────────────
const AL = 'https://graphql.anilist.co';
async function gql(q, v = {}) {
  const r = await fetch(AL, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify({ query: q, variables: v }) });
  if (!r.ok) throw new Error('AniList ' + r.status);
  const { data, errors } = await r.json();
  if (errors?.length) throw new Error(errors[0].message);
  return data;
}
const F = `id idMal title{romaji english}description(asHtml:false)coverImage{extraLarge large medium}bannerImage format status seasonYear episodes averageScore genres studios{nodes{name isAnimationStudio}}`;
async function aPage(vars) {
  const s = vars.sort || 'TRENDING_DESC';
  const q = `query($page:Int,$perPage:Int${vars.search !== undefined ? ',$search:String' : ''}${vars.genre ? ',$genre:String' : ''}${vars.season ? ',$season:MediaSeason,$year:Int' : ''}${vars.status ? ',$status:MediaStatus' : ''}){Page(page:$page,perPage:$perPage){pageInfo{hasNextPage}media(type:ANIME,sort:[${s}]${vars.search !== undefined ? ',search:$search' : ''}${vars.genre ? ',genre:$genre' : ''}${vars.season ? ',season:$season,seasonYear:$year' : ''}${vars.status ? ',status:$status' : ''}){${F}}}}`;
  const d = await gql(q, vars);
  return { results: d.Page.media || [], hasNextPage: d.Page.pageInfo.hasNextPage };
}

async function loadGrid(tab, page, genre) {
  const g = $('#mgrid');
  if (page === 1) g.innerHTML = Array(18).fill('<div class="skel"></div>').join('');
  try {
    let d;
    if (tab === 'upcoming') d = await aPage({ page, perPage: 24, sort: 'POPULARITY_DESC', status: 'NOT_YET_RELEASED' });
    else if (tab === 'recent') {
      const m = new Date().getMonth() + 1;
      const s = m <= 3 ? 'WINTER' : m <= 6 ? 'SPRING' : m <= 9 ? 'SUMMER' : 'FALL';
      d = await aPage({ page, perPage: 24, sort: 'TRENDING_DESC', season: s, year: new Date().getFullYear() });
    } else {
      const v = { page, perPage: 24, sort: tab }; if (genre) v.genre = genre;
      d = await aPage(v);
    }
    if (page === 1) g.innerHTML = '';
    d.results.forEach(a => g.appendChild(mkCard(a)));
    if (!d.results.length && page === 1) g.innerHTML = '<div style="color:var(--muted);padding:20px;grid-column:1/-1">No results.</div>';
  } catch (e) {
    if (page === 1) g.innerHTML = `<div style="color:var(--red);padding:20px;grid-column:1/-1">Error: ${e.message}</div>`;
  }
}

}

// ── EPISODE LIST ──────────────────────────────────────────────────────────────
async function loadEpList(id) {
  const endpoints = [
    `https://www.miruro.tv/api/v2/episodes?id=${id}`,
    `https://www.miruro.tv/api/episodes?id=${id}`,
    `https://www.miruro.tv/api/v1/episodes/${id}`,
  ];
  let epList = [];
  for (const url of endpoints) {
    try {
      const r = await pFetch(url);
      const text = await r.text();
      let json; try { json = JSON.parse(text); } catch { log('ep parse fail:', url); continue; }
      if (Array.isArray(json) && json.length) { epList = json; log('episodes from:', url, '→', json.length); break; }
      if (Array.isArray(json?.episodes) && json.episodes.length) { epList = json.episodes; log('episodes.episodes from:', url, '→', json.episodes.length); break; }
      if (Array.isArray(json?.data) && json.data.length) { epList = json.data; log('episodes.data from:', url, '→', json.data.length); break; }
    } catch (e) { log('ep endpoint failed:', url, e.message); }
  }
  if (!epList.length) {
    const cnt = curAnime?.episodes || 1;
    log('fallback: generating', cnt, 'episode stubs');
    epList = Array.from({ length: cnt }, (_, i) => ({ number: i + 1, title: `Episode ${i + 1}` }));
  }
  allEps = epList.map((ep, i) => ({
    number: ep.number ?? ep.ep ?? (i + 1),
    title: ep.title || ep.name || `Episode ${ep.number ?? i + 1}`,
    id: ep.id || ep.episodeId || String(ep.number ?? i + 1),
  }));
  filteredEps = allEps;
  $('#epct').textContent = allEps.length + ' eps';
  renderEpItems();
  loadEp(curEpIdx);
}

function renderEpItems() {
  const list = $('#eplist'); list.innerHTML = '';
  if (!filteredEps.length) { list.innerHTML = '<div style="padding:12px;color:var(--muted);font-size:.76rem;">No episodes.</div>'; return; }
  filteredEps.forEach(ep => {
    const ri = allEps.findIndex(e => e.number === ep.number);
    const div = document.createElement('div');
    div.className = 'epi' + (ri === curEpIdx ? ' active' : '');
    div.dataset.i = ri;
    div.innerHTML = `<div class="epn">${ep.number}</div><div class="ept">${ep.title}</div>`;
    div.onclick = () => loadEp(ri);
    list.appendChild(div);
  });
  const ae = $('.epi.active'); if (ae) ae.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
$('#epf').addEventListener('input', e => {
  const q = e.target.value.toLowerCase().trim();
  filteredEps = q ? allEps.filter(ep => ep.title.toLowerCase().includes(q) || String(ep.number).includes(q)) : allEps;
  renderEpItems();
});

// ── LOAD EPISODE ──────────────────────────────────────────────────────────────
async function loadEp(idx) {
  if (!allEps[idx]) return;
  curEpIdx = idx; retryIdx = idx;
  const ep = allEps[idx];
  $$('.epi').forEach(el => el.classList.toggle('active', parseInt(el.dataset.i) === idx));
  const ae = $('.epi.active'); if (ae) ae.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  $('#btn-prev').disabled = idx === 0;
  $('#btn-next').disabled = idx >= allEps.length - 1;
  intro = null; outro = null; $('#skip-btn').classList.remove('on');
  setMsg('Fetching stream…', true);
  try {
    const url = await getStream(ep);
    if (!url) throw new Error('No stream URL found — all sources exhausted.');
    log('▶ playing:', url);
    playHLS(url);
  } catch (e) {
    log('stream error:', e.message);
    setMsg(null, false, true, e.message, () => retryIdx !== null && loadEp(retryIdx));
  }
}

// ── GET STREAM URL ─────────────────────────────────────────────────────────────
// Strategy:
//   1. Try Miruro JSON API endpoints (fastest, clean JSON → .m3u8)
//   2. Scrape Miruro watch page HTML for an m3u8 URL
//   (NO iframes — Miruro blocks X-Frame-Options: sameorigin)
async function getStream(ep) {
  const id = curAnime.id, n = ep.number, cat = curAudio;

  // ── Round 1: JSON API endpoints ──────────────────────────────────────────
  const servers = ['vidcloud', 'vsrc', 'streamsb', 'streamtape', ''];
  const apiPatterns = [
    (srv) => `https://www.miruro.tv/api/v2/watch?id=${id}&ep=${n}${srv ? `&server=${srv}` : ''}&category=${cat}`,
    (srv) => `https://www.miruro.tv/api/watch?id=${id}&ep=${n}${srv ? `&server=${srv}` : ''}&category=${cat}`,
    (srv) => `https://www.miruro.tv/api/v2/source?id=${id}&ep=${n}${srv ? `&server=${srv}` : ''}&category=${cat}`,
    (srv) => `https://www.miruro.tv/api/v1/watch/${id}?ep=${n}${srv ? `&server=${srv}` : ''}&category=${cat}`,
  ];

  for (const pattern of apiPatterns) {
    for (const srv of servers) {
      const url = pattern(srv);
      try {
        log('trying API:', url);
        const r = await pFetch(url);
        const text = await r.text();
        let json; try { json = JSON.parse(text); } catch { continue; }
        log('API response keys:', Object.keys(json || {}));
        const m3 = extractM3(json);
        if (m3) {
          if (json.intro) intro = json.intro;
          if (json.outro) outro = json.outro;
          log('✓ m3u8 from API:', m3.slice(0, 80));
          return m3;
        }
      } catch (e) { log('API fail:', url.slice(0, 60), e.message); }
    }
  }

  // ── Round 2: scrape the Miruro watch page HTML ────────────────────────────
  log('falling back to page scrape…');
  const titles = [
    curAnime.title?.english,
    curAnime.title?.romaji,
    String(id),
  ].filter(Boolean);

  for (const title of titles) {
    const slug = mkSlug(title);
    const pageUrl = `https://www.miruro.tv/watch/${id}/${slug}?ep=${n}`;
    try {
      log('scraping page:', pageUrl);
      const r = await pFetch(pageUrl);
      const html = await r.text();
      const m3 = scrapeM3(html);
      if (m3) { log('✓ m3u8 from page scrape:', m3.slice(0, 80)); return m3; }
    } catch (e) { log('page scrape fail:', e.message); }
  }

  return null;
}

// ── HELPERS: extract m3u8 from JSON / HTML ─────────────────────────────────
function extractM3(j) {
  if (!j) return null;
  // Direct string fields
  for (const key of ['url', 'stream', 'link', 'src', 'file', 'streamUrl', 'playUrl', 'hls']) {
    if (typeof j[key] === 'string' && j[key].includes('.m3u8')) return j[key];
  }
  // sources / streams arrays
  for (const key of ['sources', 'streams', 'links']) {
    if (Array.isArray(j[key])) {
      const best = j[key].find(s => (s.url || s.file || s.src || '').includes('.m3u8'));
      if (best) return best.url || best.file || best.src;
    }
  }
  // Recurse into wrapper fields
  for (const key of ['data', 'result', 'video', 'media', 'stream', 'source']) {
    if (j[key] && typeof j[key] === 'object') {
      const r = extractM3(j[key]); if (r) return r;
    }
  }
  // Last resort: scan all string values
  for (const v of Object.values(j)) {
    if (typeof v === 'string' && v.includes('.m3u8')) return v;
  }
  return null;
}

function scrapeM3(html) {
  const patterns = [
    /["'`](https?:\/\/[^"'`\s]*?\.m3u8[^"'`\s]*?)["'`]/g,
    /(?:src|file|url|source|hls)\s*[:=]\s*["']?(https?:\/\/[^"'\s,;>]*?\.m3u8[^"'\s,;>]*)["']?/gi,
    /(https?:\/\/\S+\.m3u8[^\s"'<>]*)/g,
  ];
  for (const re of patterns) {
    re.lastIndex = 0;
    const m = re.exec(html);
    if (m) return m[1];
  }
  return null;
}

// ── HLS PLAYER ────────────────────────────────────────────────────────────────
function playHLS(rawUrl) {
  const url = pStream(rawUrl);  // route through worker /stream for CORS
  const v = $('#player');
  hideMsg();

  if (window._hls) { window._hls.destroy(); window._hls = null; }

  if (Hls.isSupported()) {
    const hls = new Hls({
      maxBufferLength: 30,
      enableWorker: false,
      xhrSetup(xhr) {
        // headers already handled by worker
      },
    });
    window._hls = hls;
    hls.loadSource(url);
    hls.attachMedia(v);
    hls.on(Hls.Events.MANIFEST_PARSED, () => { log('HLS manifest parsed, playing'); v.play().catch(() => {}); });
    hls.on(Hls.Events.ERROR, (_, d) => {
      log('HLS error:', d.type, d.details, d.fatal);
      if (d.fatal) setMsg(null, false, true, 'Playback error — try Retry or switch SUB/DUB.', () => retryIdx !== null && loadEp(retryIdx));
    });
  } else if (v.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari native HLS
    v.src = url; v.load(); v.play().catch(() => {});
  } else {
    setMsg(null, false, true, 'HLS not supported in this browser. Try Chrome or Firefox.');
  }
}

    if (retryFn && $('#rbtn')) $('#rbtn').onclick = retryFn;
  } else {
    m.innerHTML = (spin ? '<div class="spin"></div>' : '') + `<div class="ptxt">${txt || ''}</div>`;
  }
}

// ── ANIME INFO ────────────────────────────────────────────────────────────────
function renderInfo() {
  const a = curAnime; if (!a) return;
  const t = a.title?.english || a.title?.romaji || '';
  const img = a.coverImage?.large || FB;
  const desc = strip(a.description || '');
  const sc = a.averageScore;
  const c = sc >= 80 ? 'var(--green)' : sc >= 60 ? 'var(--gold)' : 'var(--red)';
  $('#ainfo').innerHTML = `<div class="aihead"><div class="aiposter"><img src="${img}" alt="${t}"></div><div><div class="aititle">${t}</div><div class="aichips">${(a.genres || []).slice(0, 5).map(g => `<span class="chip">${g}</span>`).join('')}</div><div class="aistats">${sc ? `<div><div class="aisv" style="color:${c}">★ ${(sc / 10).toFixed(1)}</div><div class="aisl">Score</div></div>` : ''}<div><div class="aisv">${a.episodes || '?'}</div><div class="aisl">Episodes</div></div><div><div class="aisv">${a.seasonYear || '—'}</div><div class="aisl">Year</div></div><div><div class="aisv" style="font-size:.68rem">${a.status || '—'}</div><div class="aisl">Status</div></div></div></div></div><div class="aidesc col" id="aidesc">${desc}</div><button class="xbtn" onclick="toggleDesc()">Show more ↓</button>`;
}
function toggleDesc() { const d = $('#aidesc'), b = d.nextElementSibling; const c = d.classList.toggle('col'); b.textContent = c ? 'Show more ↓' : 'Show less ↑'; }

// ── RELATED ───────────────────────────────────────────────────────────────────
function renderRel() {
  const a = curAnime; if (!a) return;
  const rels = (a.relations?.edges || []).map(e => ({ id: e.node.id, title: e.node.title, img: e.node.coverImage?.large, type: e.relationType }));
  const recs = (a.recommendations?.nodes || []).map(n => n.mediaRecommendation).filter(Boolean).map(m => ({ id: m.id, title: m.title, img: m.coverImage?.large, type: 'REC' }));
  const items = [...rels.slice(0, 6), ...recs.slice(0, 5)].filter(r => r.id);
  const s = $('#relsec');
  if (!items.length) { s.style.display = 'none'; return; }
  s.style.display = 'block';
  s.innerHTML = `<div class="sectitle">Related & Recommended</div><div class="relscroll">${items.map(r => `<div class="relcard" onclick="openAnime(${r.id})"><img src="${r.img || FB}" loading="lazy" onerror="this.src='${FB}'"><div class="relct">${r.title?.english || r.title?.romaji || ''}</div><div class="relcf">${r.type || ''}</div></div>`).join('')}</div>`;
}

// ── PAGE NAV ──────────────────────────────────────────────────────────────────
function showPage(id) { $$('.page').forEach(p => p.classList.remove('active')); $('#' + id).classList.add('active'); window.scrollTo(0, 0); }
function showHome() { if (window._hls) { window._hls.destroy(); window._hls = null; } $('#player').pause(); showPage('home'); }

// ── INIT ──────────────────────────────────────────────────────────────────────
loadSpotlight();
loadGrid('TRENDING_DESC', 1, '');
</script>
</body>
